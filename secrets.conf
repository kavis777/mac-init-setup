# シークレット定義ファイル
# 新しいシークレットを追加するには、1行追加するだけでOK
#
# 書式:
#   json:<bw_item_name>:<target_file>:<jq_path>
#     → Bitwardenのパスワードを対象JSONファイルの指定パスに注入
#   file:<bw_item_name>:<target_file>[:<chmod>]
#     → Bitwardenのパスワードを平文ファイルとして書き出す（chmod省略時は600）
#       1行のトークンを置くだけのファイル向け
#   gh:<bw_item_name>
#     → Bitwardenのパスワードで gh auth login --with-token を実行
#   ssh:<bw_item_name>
#     → Bitwardenのセキュアノートから ~/.ssh/ にファイルを復元

# Claude Code MCP トークン（~/.claude.json が Claude Code の実際の読み込み先）
json:claude-slack-bot-token:~/.claude.json:.mcpServers.slack.env.SLACK_BOT_TOKEN
json:claude-kibela-access-token:~/.claude.json:.mcpServers.kibela.env.KIBELA_ACCESS_TOKEN
json:claude-youtrack-mcp-token:~/.claude.json:.mcpServers.YouTrack.headers.Authorization
json:claude-bugsnag-api-key:~/.claude.json:.mcpServers.bugsnag.env.BUGSNAG_API_KEY

# Claude Code MCP トークン（settings.local.json 側。旧定義だが残してある）
json:claude-slack-bot-token:~/.claude/settings.local.json:.mcpServers.slack.env.SLACK_BOT_TOKEN
json:claude-kibela-access-token:~/.claude/settings.local.json:.mcpServers.kibela.env.KIBELA_ACCESS_TOKEN
json:claude-figma-token:~/.claude/settings.local.json:.env.FIGMA_TOKEN

# youtrack-agile MCP サーバーの永続トークン
file:youtrack-permanent-token:~/.config/youtrack/token:600

# Slack に本人名義で投稿するためのユーザートークン（xoxp-）
file:slack-user-token:~/.config/slack/token:600

# GitHub CLI
gh:github-pat

# SSH鍵
ssh:ssh-keys
